name: Quell PR Report

# SECURITY: this workflow executes pull request code, including code from
# forks. It therefore runs on `pull_request` (NOT `pull_request_target`),
# which gives it a read-only token, no secrets, and no access to the base
# repository's cache scope.
#
# It previously used `pull_request_target` while checking out
# `github.event.pull_request.head.sha` and exposing `secrets.QUELL_API_KEY`.
# That is the "pwn request" pattern: any fork could open a PR whose code
# exfiltrates the secret and uses the write-scoped token. actions/checkout
# now refuses that combination outright, which is what surfaced this.
#
# Do NOT "fix" a checkout failure here with `allow-unsafe-pr-checkout: true`
# — that reinstates the vulnerability. Posting the PR comment needs write
# access, so it is split into quell-pr-comment.yml, which runs from the base
# repository via workflow_run and never checks out PR code.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "quell/**/*.py"

permissions:
  contents: read

jobs:
  quell-report:
    name: Quell requirement coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Quell
        run: uv sync

      # `quell check` was removed in v1.2 and now exits 1; `quell find` is a
      # superset of it. The rule engine is the default — no LLM, no network,
      # so this job needs no API key at all.
      - name: Run Quell on changed files
        run: uv run quell find quell/ || true

      # quell find always writes quell-report.json to the project root.
      - name: Stage report for the comment workflow
        run: |
          echo "${{ github.event.pull_request.number }}" > pr_number.txt
          test -f quell-report.json || echo '{}' > quell-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: quell-report
          path: |
            quell-report.json
            pr_number.txt
          retention-days: 1
